<!-- web/templates/base.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Daily Tuner{% endblock %}</title>

    {% block styles %}
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        h2 {
            color: #555;
            margin-bottom: 15px;
            font-size: 18px;
        }
        h3 {
            color: #666;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 14px;
            margin: 8px 0 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        .nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .nav-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            margin: 0;
            padding: 12px;
            flex: 1;
            min-width: 100px;
        }
        .nav-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        .error {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #c00;
        }
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #2e7d32;
        }
        .warning {
            background: #fff3e0;
            color: #e65100;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #ff9800;
        }
        .info {
            background: #e3f2fd;
            color: #1565c0;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #2196f3;
        }
        .auth-type {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .auth-type label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 10px;
            border-radius: 10px;
            transition: background 0.3s ease;
        }
        .auth-type label:hover {
            background: #f0f0f0;
        }
        .auth-type input {
            width: auto;
            margin: 0;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .energy-bar {
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
        }
        .energy-fill {
            background: linear-gradient(90deg, #4caf50, #ff9800, #f44336);
            height: 30px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            margin: 20px;
        }
        hr {
            margin: 20px 0;
            border: none;
            border-top: 1px solid #e0e0e0;
        }
        .hidden {
            display: none !important;
        }
        .flex {
            display: flex;
        }
        .flex-1 {
            flex: 1;
        }
        .gap-10 {
            gap: 10px;
        }
        .user-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            background: white;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .user-name {
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }
        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            width: auto;
            margin: 0;
        }
        .logout-btn:hover {
            background: #c82333;
            opacity: 1;
            transform: none;
        }
        .yandex-btn {
            background: #fc3f1d;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .yandex-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(252, 63, 29, 0.3);
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #999;
            gap: 15px;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }
        /* ===== СОГЛАСИЕ НА ПЕРСОНАЛЬНЫЕ ДАННЫЕ ===== */
        .consent-block {
            margin: 20px 0 15px;
            padding: 16px 20px;
            background: #f8f9fc;
            border-radius: 12px;
            border-left: 4px solid #667eea;
            text-align: left;
            width: 100%;
            transition: background 0.3s ease;
        }

        .consent-block:hover {
            background: #f0f3ff;
        }

        .consent-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            cursor: pointer;
            font-size: 14px;
            line-height: 1.5;
            color: #1a1a2e;
        }

        .consent-checkbox input[type="checkbox"] {
            display: none;
        }

        .checkmark {
            min-width: 20px;
            height: 20px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 6px;
            display: inline-block;
            position: relative;
            margin-top: 2px;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .consent-checkbox input:checked + .checkmark {
            background: #667eea;
            border-color: #667eea;
        }

        .consent-checkbox input:checked + .checkmark::after {
            content: "✓";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .consent-text {
            color: #2d2d44;
            font-size: 13px;
        }

        .consent-text a {
            color: #667eea;
            text-decoration: underline;
            font-weight: 500;
        }

        .consent-text a:hover {
            color: #5a6fd6;
        }

        .consent-text small {
            display: block;
            margin-top: 6px;
            color: #6b6b83;
            font-size: 12px;
        }

        /* Кнопка Яндекс в disabled состоянии */
        .yandex-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .yandex-btn:not(:disabled):hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(252, 63, 29, 0.3);
        }

        /* Юридическая заметка */
        .legal-note {
            font-size: 12px;
            color: #6b6b83;
            margin-top: 15px;
            text-align: center;
        }

        .legal-note a {
            color: #667eea;
            text-decoration: none;
        }

        .legal-note a:hover {
            text-decoration: underline;
        }

        /* Анимация появления */
        .consent-block {
            animation: fadeInUp 0.4s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    {% endblock %}
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
