services:
  postgres:
    image: postgres:15-alpine
    container_name: pa-postgres
    ports:
      - "5432:5432"  
    environment:
      POSTGRES_DB: personalassistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgrespassword
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initscripts:/docker-entrypoint-initdb.d:ro
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    secrets:
      - postgrespassword
    networks:
      - pa-net  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personalassistant"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  backend-api:
    build:
      context: ./app
      dockerfile: Dockerfile.backend
    command: ["uvicorn", "backend.assistant_api:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "info"]
    depends_on:
      postgres:
        condition: service_healthy
      db-restore:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL_FILE=/run/secrets/db-url  
    networks:
      - pa-net
    secrets:
      - db-url
      - backend-api-key
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:                             
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M


  web-ui:
    build:
      context: ./app
      dockerfile: Dockerfile.web
    container_name: pa-webui
    ports:
      - "8080:8080"
    environment:
      - BACKEND_API_URL=http://backend-api:8000/api/v1 
      - YANDEX_CLIENT_ID_FILE=/run/secrets/yandex-client-id
      - YANDEX_CLIENT_SECRET_FILE=/run/secrets/yandex-client-secret
      - YANDEX_REDIRECT_URI_FILE=/run/secrets/yandex-redirect-uri
      - JWT_SECRET_FILE=/run/secrets/jwt-secret
    secrets:
      - backend-api-key
      - db-url
      - yandex-client-id
      - yandex-client-secret
      - yandex-redirect-uri
      - jwt-secret
    networks:
      - pa-net
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M


  cron-backup:
    image: postgres:15-alpine
    container_name: pa-backup
    command: >
      sh -c "
        echo '0 3 * * * /backup.sh' > /etc/crontabs/root &&
        crond -f
      "
    volumes:
      - ./scripts/backup-db.sh:/backup.sh:ro
      - ./backups:/backups
      - ./logs:/var/log/backup
    environment:
      - PGPASSWORD_FILE=/run/secrets/postgrespassword
    secrets:
      - postgrespassword
    networks:
      - pa-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "postgres", "-U", "postgres" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M


  db-restore:
    image: postgres:15-alpine
    container_name: pa-db-restore
    command: >
      sh -c "
        echo '⏳ Waiting for postgres...' &&
        sleep 10 &&
        echo '🔄 Starting restore...' &&
        sh /restore-on-start.sh
      "
    volumes:
      - ./scripts/restore-on-start.sh:/restore-on-start.sh:ro
      - ./initscripts:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups:ro
    environment:
      - PGPASSWORD_FILE=/run/secrets/postgrespassword
    secrets:
      - postgrespassword
    networks:
      - pa-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

# ============================================
# MONITORING
# ============================================

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: pa-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=2GB'
      - '--web.enable-lifecycle'
      - '--web.listen-address=0.0.0.0:9090'
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - ./docker-secrets/minio-root-password.txt:/secrets/minio-password.txt:ro
      - prometheus_data:/prometheus
    networks:
      - pa-net
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      cron-backup:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: pa-postgres-exporter
    user: root
    entrypoint: [ "/entrypoint.sh" ]
    volumes:
      - ./scripts/postgres-exporter-entrypoint.sh:/entrypoint.sh:ro
      - ./config/postgres-exporter.yml:/postgres_exporter.yml:ro
    secrets:
      - postgrespassword
    networks:
      - pa-net
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
      cron-backup:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  grafana:
    image: grafana/grafana:11.1.0
    container_name: pa-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=paadmin
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana-password
      - GF_SERVER_ROOT_URL=http://localhost:3001
      #- GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    secrets:
      - grafana-password
    networks:
      - pa-net
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M


  # ============================================
  # PSYCHOMETRY SERVICE
  # ============================================

  psychometry-service:
    build:
      context: ./app
      dockerfile: Dockerfile.psychometry
    container_name: pa-psychometry
    command: [ "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "info" ]
    ports:
      - "127.0.0.1:8002:8000"  # Internal port, not exposed to public
      - "127.0.0.1:9091:9090"  # Metrics
    environment:
      - DATABASE_URL_FILE=/run/secrets/db-url
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgrespassword
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
      - DB_POOL_TIMEOUT=30
      - DB_POOL_RECYCLE=3600

      # JWT (из секретов)
      - JWT_SECRET_KEY_FILE=/run/secrets/jwt-secret
      - JWT_ALGORITHM=HS256
      - JWT_AUDIENCE=psychometry
      - JWT_ISSUER=personal-assistant

      # Astro Service (fallback если недоступен)
      - ASTRO_SERVICE_URL=http://astro-service:8000
      - ASTRO_FALLBACK_MODE=true
      - ASTRO_TIMEOUT=3.0

      # Data Lake (MinIO)
      - LAKE_ENDPOINT=minio:9000
      - LAKE_BUCKET=personal-assistant-lake
      - LAKE_ACCESS_KEY_FILE=/run/secrets/s3-access-key
      - LAKE_SECRET_KEY_FILE=/run/secrets/s3-secret-key
      - LAKE_USE_SSL=false
      - LAKE_REGION=us-east-1
      - LAKE_UPLOAD_TIMEOUT=30

      # Test Intervals
      - MMPI_INTERVAL_DAYS=90
      - IAT_INTERVAL_DAYS=30

      # Outbox
      - OUTBOX_POLL_INTERVAL=30
      - OUTBOX_MAX_RETRY=5
      - OUTBOX_STALE_MINUTES=5
      - OUTBOX_BATCH_SIZE=100

      # Rate Limiting
      - RATE_LIMIT_REQUESTS=10
      - RATE_LIMIT_PERIOD=60

      # Service
      - SERVICE_NAME=psychometry
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-production}

      # Metrics
      - METRICS_ENABLED=true
      - METRICS_PORT=9090

      # API
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_PREFIX=/api/v1/psych

      # MMPI Norms
      - MMPI_NORMS_PATH=/app/psychometry/data/mmpi_norms.json
    volumes:
      - ./app/psychometry:/app/psychometry:ro
    secrets:
      - jwt-secret
      - postgrespassword
      - db-url
      - s3-access-key
      - s3-secret-key
    networks:
      - pa-net
    depends_on:
      postgres:
        condition: service_healthy
      db-restore:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # OUTBOX WORKER (отдельный процесс)
  # ============================================

  psychometry-outbox-worker:
    build:
      context: ./app
      dockerfile: Dockerfile.psychometry
    container_name: pa-psychometry-worker
    command: [ "python", "-m", "src.workers.outbox_worker" ]
    environment:
      # Database
      - DATABASE_URL_FILE=/run/secrets/db-url
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=10

      # JWT
      - JWT_SECRET_KEY_FILE=/run/secrets/jwt-secret

      # Astro
      - ASTRO_SERVICE_URL=http://astro-service:8000
      - ASTRO_FALLBACK_MODE=true
      - ASTRO_TIMEOUT=3.0

      # Data Lake
      - LAKE_ENDPOINT=minio:9000
      - LAKE_BUCKET=personal-assistant-lake
      - LAKE_ACCESS_KEY_FILE=/run/secrets/s3-access-key
      - LAKE_SECRET_KEY_FILE=/run/secrets/s3-secret-key
      - LAKE_USE_SSL=false
      - LAKE_REGION=us-east-1

      # Outbox
      - OUTBOX_POLL_INTERVAL=30
      - OUTBOX_MAX_RETRY=5
      - OUTBOX_STALE_MINUTES=5
      - OUTBOX_BATCH_SIZE=100

      # Service
      - SERVICE_NAME=psychometry-worker
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    volumes:
      - ./app/psychometry:/app/psychometry:ro
    secrets:
      - jwt-secret
      - postgrespassword
      - db-url
      - s3-access-key
      - s3-secret-key
    networks:
      - pa-net
    depends_on:
      postgres:
        condition: service_healthy
      db-restore:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # НЕТ depends_on astro-service
    healthcheck:
      test: [ "CMD", "python", "-c", "import sys; sys.exit(0)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # MINIO (Data Lake)
  # ============================================

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: pa-minio
    user: 1000:1000
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: paadmin
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio-root-password
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      #- /mnt/minio-data:/data  # ← отдельный диск для продакшена
      - ./minio_data:/data  # ← для локальной разработки
    command: server /data --console-address ":9001"
    secrets:
      - minio-root-password
    networks:
      - pa-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # MINIO INIT - PRODUCTION
  # ============================================

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: pa-minio-init
    depends_on:
      minio:
        condition: service_healthy
    secrets:
      - minio-root-password
      - s3-access-key
      - s3-secret-key
    volumes:
      - ./scripts/minio-init.sh:/init.sh:ro
      - ./config/minio-policies:/policies:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    networks:
      - pa-net
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

volumes:
  pgdata: {}
  grafana_data: {}
  prometheus_data: {}

secrets:
  postgrespassword:
    file: ./docker-secrets/postgrespassword.txt
  apppassword:
    file: ./docker-secrets/app_password.txt
  bot-token:
    file: ./docker-secrets/bot-token.txt
  db-url:
    file: ./docker-secrets/db-url.txt
  backend-api-key:
    file: ./docker-secrets/backend-api-key.txt
  yandex-client-id:
    file: ./docker-secrets/yandex-client-id
  yandex-client-secret:
    file: ./docker-secrets/yandex-client-secret
  yandex-redirect-uri:
    file: ./docker-secrets/yandex-redirect-uri
  jwt-secret:
    file: ./docker-secrets/jwt-secret
  grafana-password:
    file: ./docker-secrets/grafana-password.txt
  minio-root-user:
    file: ./docker-secrets/minio-root-user.txt
  minio-root-password:
    file: ./docker-secrets/minio-root-password.txt
  s3-access-key:
    file: ./docker-secrets/s3-access-key
  s3-secret-key:
    file: ./docker-secrets/s3-secret-key

networks:
  pa-net:
    driver: bridge

