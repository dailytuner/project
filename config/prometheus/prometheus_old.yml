global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
  # PostgreSQL Exporter
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
  
  # Psychometry Service Metrics
  - job_name: 'psychometry-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['psychometry-service:9090']
    scrape_interval: 30s
  
  # MinIO Metrics
  - job_name: 'minio'
    metrics_path: '/minio/v2/metrics/cluster'
    static_configs:
      - targets: ['minio:9000']
    basic_auth:
      username: 'paadmin'
      password_file: '/etc/prometheus/minio-password.txt'
